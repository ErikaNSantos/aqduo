name: Despertador do Supabase

# O plano gratuito do Supabase pausa o projeto depois de 7 dias sem uso.
# Duas vezes por semana esta tarefa grava a hora no banco pela função acordar()
# (supabase/despertador.sql). Só uma leitura não bastou: o projeto pausou em 30/10 mesmo assim.
on:
  schedule:
    - cron: "17 12 * * 1,4" # segundas e quintas, 9h17 em Brasília
  workflow_dispatch:

jobs:
  acordar:
    runs-on: ubuntu-latest
    steps:
      - name: Gravar no banco
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          CHAVE: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$CHAVE" ]; then
            echo "Faltam as variáveis VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY no repositório."
            exit 1
          fi
          resposta=$(curl -s -w "\n%{http_code}" -X POST "$URL/rest/v1/rpc/acordar" \
            -H "apikey: $CHAVE" -H "Content-Type: application/json" -d '{}')
          codigo=$(echo "$resposta" | tail -n1)
          echo "Resposta do Supabase: $codigo, acordado em $(echo "$resposta" | head -n1)"
          [ "$codigo" = "200" ]
